<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview PDFMake - Contrato</title>
  <link rel="stylesheet" href="css/styles.css">

</head>

<body>
  <header class="toolbar">
    <div>
      <h1>Vista previa del contrato</h1>
      <p>Documento generado con PDFMake</p>
    </div>

    <div class="actions">
      <button type="button" onclick="mostrarPreview()">↻ Actualizar</button>
      <button type="button" onclick="imprimirPdf()">🖨 Imprimir</button>
      <button type="button" class="primary" onclick="descargarPdf()">⬇ Descargar PDF</button>
    </div>
  </header>

  <main class="viewer">
    <div id="loading" class="loading">Generando PDF...</div>
    <iframe
      id="pdfPreview"
      title="Vista previa del PDF"
      hidden>
    </iframe>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/pdfmake.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/vfs_fonts.js"></script>
  <script src="js/doc-definition.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
